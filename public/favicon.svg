<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#FF00FF" />
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Cyberpunk Hexagon Border -->
  <polygon points="50,6 90,29 90,71 50,94 10,71 10,29" fill="#030308" stroke="url(#neonGlow)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Glowing "X" Symbol -->
  <path d="M32,32 L68,68 M68,32 L32,68" stroke="url(#neonGlow)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="5" fill="#FFFFFF" filter="url(#glow)"/>
</svg>